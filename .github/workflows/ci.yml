name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MOON_WORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.toolchain }}
      - name: Check all targets
        run: |
          moon version --all
          moon update
          moon check --target all
      - name: Verify independent hash vectors
        run: |
          moon test src/hash_kat_test.mbt --target all
          moon test src/hash_kat_test.mbt --target all --release
      - name: Test debug and release
        run: |
          timeout 90s moon test --target all
          timeout 90s moon test --target all --release
      - name: Verify generated interfaces and formatting
        run: |
          moon info --target all
          moon fmt
          git diff --exit-code
      - name: Generate coverage
        if: matrix.toolchain == 'latest'
        run: |
          moon test --target wasm-gc --enable-coverage
          moon coverage report -f coveralls -o codecov_report.json
      - uses: codecov/codecov-action@v5
        if: matrix.toolchain == 'latest'
        with:
          files: codecov_report.json
          token: ${{ secrets.CODECOV_TOKEN }}
